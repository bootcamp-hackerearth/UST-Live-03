sonar.projectKey=POS-NEXT
sonar.projectName=POS-NEXT
sonar.projectVersion=1.0
 
sonar.sources=app
sonar.sourceEncoding=UTF-8
 
# JS/TS config
sonar.language=js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
 
# Exclusions (important for Next.js)
sonar.exclusions=node_modules/**,.next/**,out/**,build/**,app/register/**

# Ignore known false positive accessibility issue on the registration page
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S6853
sonar.issue.ignore.multicriteria.e1.resourceKey=app/register/page.jsx
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S6853
sonar.issue.ignore.multicriteria.e2.resourceKey=**/app/register/page.jsx
 
# Optional: Test files
sonar.tests=app
sonar.test.inclusions=**/*.test.js,**/*.test.tsx